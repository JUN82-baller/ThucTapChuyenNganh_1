{% extends "base.html" %}
{% block content %}
<h2>Edit Album: {{ album.title }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <h3>Songs</h3>
    {{ formset.management_form }}
    {% for song_form in formset %}
        <div class="song-form border p-2 mb-2">
            {{ song_form.as_p }}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn-primary">Save changes</button>
    <a href="{% url 'albums' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
