{% extends 'base.html' %}
{% block content %}
<div class ="container py-5" style="margin-top:80px;">
    <h2>{{ title }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'albums' %}">Cancel</a>

    </form>
</div>
{% endblock %}
