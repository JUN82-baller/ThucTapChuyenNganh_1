{% extends "base.html" %}
{% load static %}
{% block title %} Đăng ký - One Music {% endblock %}
{% block content %}
    <!-- ##### Breadcumb Area Start ##### -->
    <section class="breadcumb-area bg-img bg-overlay text-center" style="background-image: url('{% static "img/bg-img/breadcumb3.jpg" %}');">
        <div class="bradcumbContent">
            <p>Join us today</p>
            <h2>Register</h2>
        </div>
    </section>
    <!-- ##### Breadcumb Area End ##### -->

    <!-- ##### Register Area Start ##### -->
    <section class="register-area section-padding-100">
        <div class="container">
            <div class="row justify-content-center">
                <!-- căn giữa bằng col và text-center -->
                <div class="col-12 col-lg-6">
                    <div class="register-content text-center">
                        <h3>Create Your Account</h3>
                        <!-- Register Form -->
                        <div class="register-form mt-4">
                            <form method="post" class="text-left">
                                {% csrf_token %}
                                <div class="form-group">
                                    <label for="username">User</label>
                                    <input type="text" name="username" class="form-control" id="username" placeholder="Enter Username">
                                </div>
                                <div class="form-group">
                                    <label for="email">Email address</label>
                                    <input type="email" name="email" class="form-control" id="email" placeholder="Enter E-mail">
                                </div>
                                <div class="form-group">
                                    <label for="password1">Password</label>
                                    <input type="password" name="password1" class="form-control" id="password1" placeholder="Password">
                                </div>
                                <div class="form-group">
                                    <label for="password2">Password authentication</label>
                                    <input type="password" name="password2" class="form-control" id="password2" placeholder="Confirm Password">
                                </div>
                                <button type="submit" class="btn oneMusic-btn mt-30 w-100">Register</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- ##### Register Area End ##### -->
{% endblock %}
